name: Build and publish belihaazi.com

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # every day at 06:00 IST, picks up new Medium posts
  workflow_dispatch:        # "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (which also feeds ChatGPT search and Copilot), Yandex and others that pages changed.
  # Skipped on the daily run so search engines only hear about real edits.
  notify-search-engines:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          sleep 30
          python3 - <<'EOF'
          import json, re, urllib.request
          KEY = "383443aa7e36f9f3af2e6d21c682fdee"
          sm = urllib.request.urlopen("https://belihaazi.com/sitemap.xml").read().decode()
          urls = re.findall(r"<loc>([^<]+)</loc>", sm) + ["https://belihaazi.com/llms.txt"]
          body = json.dumps({"host": "belihaazi.com", "key": KEY,
                             "keyLocation": f"https://belihaazi.com/{KEY}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(req).status, "for", len(urls), "URLs")
          EOF
